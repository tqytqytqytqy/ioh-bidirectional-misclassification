phase_convention: start_anchored_offset_0
baseline_interval_min: 5
fixed_intervals_min: [3, 2.5]
induction_intensified:
  induction_window_min: 20
  induction_interval_min: 1
  maintenance_interval_min: 5
threshold_triggered_adaptive:
  baseline_interval_min: 5
  intensified_interval_min: 1
  trigger_visible_map_lt: 70
  intensify_for_min: 5
  retrigger_extends_window: true
trend_triggered_adaptive:
  baseline_interval_min: 5
  intensified_interval_min: 1
  trigger_drop_mmHg: 8
  trigger_visible_map_lt: 75
  intensify_for_min: 3
  retrigger_extends_window: true
selective_continuous:
  outcome: hidden_auc_at_map_65_under_phase_averaged_fixed_5min
  high_risk_definition: at_or_above_80th_percentile
  predictors: [age, asa, emergency_status, anaesthesia_duration, sex, department, procedure_type]
  model: logistic_regression
  solver: liblinear
  class_weight: balanced
  max_iter: 1000
  cross_validation: stratified_5_fold_out_of_fold
  seed: 20260706
  rank_cutoffs: [0.05, 0.10, 0.20, 0.30, 0.50]
